name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its previous run; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  portal:
    name: Merchant portal (types, lint, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose --profile test build portal-test
      - run: docker compose --profile test run --rm portal-test

  go-unit:
    name: Go API (gofmt, vet, unit tests with race detector)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same container as go-test, without the database: integration tests
      # skip themselves when TEST_DATABASE_DSN is empty, and the integration
      # job below runs them against MySQL.
      - run: >
          docker compose --profile test run --rm --no-deps -e TEST_DATABASE_DSN= go-test
          sh -c 'test -z "$(gofmt -l .)" && go vet ./... && go test -race ./...'

  # The PHP image needs Laravel Nova, a licensed package. Jobs that build it
  # run only when the NOVA_USERNAME and NOVA_LICENSE_KEY repository secrets
  # exist; on forks, where secrets are not available, they are skipped.
  nova:
    name: Check Nova credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
        run: |
          if [ -n "$NOVA_USERNAME" ] && [ -n "$NOVA_LICENSE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::NOVA_USERNAME / NOVA_LICENSE_KEY are not set, so the PHP, integration and stack jobs are skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: PHP (PHPStan, PHPUnit) and Go integration tests
    needs: nova
    if: needs.nova.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh .github/scripts/composer-auth.sh
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
      - name: PHP static analysis (PHPStan)
        run: docker compose --profile test run --rm phpstan
      - name: PHP tests (PHPUnit against MySQL)
        run: docker compose --profile test run --rm php-test
      - name: Go integration tests with race detector (schema from the PHP migrations)
        run: docker compose --profile test run --rm go-test
      - if: always()
        run: docker compose --profile test down --volumes

  # Starts the whole system, checks the API through Nginx and exercises both
  # portals in a real Chromium browser.
  stack:
    name: Full stack (smoke + browser E2E)
    needs: nova
    if: needs.nova.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sh .github/scripts/composer-auth.sh
        env:
          NOVA_USERNAME: ${{ secrets.NOVA_USERNAME }}
          NOVA_LICENSE_KEY: ${{ secrets.NOVA_LICENSE_KEY }}
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Smoke test
        run: sh scripts/smoke-test.sh
      - name: Browser E2E (Playwright)
        run: docker compose --profile e2e run --rm --build e2e
      - name: Restart and test again (data must survive, seeders must not duplicate)
        run: |
          docker compose --profile e2e down
          docker compose up --detach --wait --wait-timeout 300
          sh scripts/smoke-test.sh
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failures
          path: artifacts/playwright/
          if-no-files-found: ignore
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose --profile e2e down --volumes
