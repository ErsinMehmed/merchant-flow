resolver 127.0.0.11 valid=10s ipv6=off;

upstream php_runtime {
    zone php_runtime 64k;
    server php:9000 resolve;
}

upstream go_api {
    zone go_api 64k;
    server go-api:8081 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location = /health/php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/health.php;
        fastcgi_pass php_runtime;
    }

    location /api/ {
        proxy_pass http://go_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        default_type application/json;
        return 503 '{"message":"Admin portal is not implemented yet."}';
    }

    location /admin/ {
        default_type application/json;
        return 503 '{"message":"Admin portal is not implemented yet."}';
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
