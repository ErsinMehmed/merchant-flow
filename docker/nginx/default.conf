resolver 127.0.0.11 valid=10s ipv6=off;

upstream php_runtime {
    zone php_runtime 64k;
    server php:9000 resolve;
}

upstream go_api {
    zone go_api 64k;
    server go-api:8081 resolve;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location = /health/php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/health.php;
        fastcgi_pass php_runtime;
    }

    # Go API: the merchant portal's only backend. The path is passed through
    # unchanged; Go serves everything under /api.
    location /api/ {
        proxy_pass http://go_api;
        # $http_host keeps the port, which the API compares with Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nova (PHP-FPM). Its compiled assets are copied to a shared volume by
    # the init service.
    location /vendor/nova/ {
        alias /usr/share/nginx/php-public/vendor/nova/;
        try_files $uri =404;
        expires 7d;
    }

    location = /admin {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php_runtime;
    }

    location ^~ /admin/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php_runtime;
    }

    location ^~ /nova-api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_pass php_runtime;
    }

    # React merchant portal. Hashed bundles are cached for good; index.html is
    # always revalidated so a rebuild is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        # AG Grid injects its styles at runtime, hence 'unsafe-inline' for styles only.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
